# Deploy the site with GitHub Actions instead of the legacy Pages builder.
#
# The legacy builder repeatedly errored or hung on this repository (three
# failed or stalled builds in a row, the last one running over two hours) even
# with .nojekyll present. This publishes the repository contents as a static
# artifact directly, with no build step to fail.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
